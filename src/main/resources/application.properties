spring.application.name=MySpringBoot4Project

server.port=8087

myboot.name=Spring
myboot.age=${random.int(1,100)}
myboot.fullName=${myboot.name} Boot

#spring.profiles.active=test
spring.profiles.active=prod

#actuator endpoints 모두 공개
management.endpoints.web.exposure.include=*

# SpringBoot Admin Server
#spring.boot.admin.client.url=http://localhost:8090

# CORS 허용 Origin ( 쉼표로 구분, 프론트엔드 개발서버 주소 )
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500
